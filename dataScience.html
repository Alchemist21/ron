<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>DataScience</title>
<style>
div#test { 
    margin: auto;
    border:rgb(5, 22, 121) 3px solid; 
    padding:10px 40px 40px 40px; 
    background-color:rgb(65, 112, 139); 
    width:50%;
}

body {
    background-color: rgb(14, 13, 13);
    margin: 50px;
    padding: 50px;
    
}
h1, h2 {
    color: azure;
    text-align: center;
}
</style>
    

<script type="text/javascript">
// pos is position of where the user in the test or which question they're up to
var pos = 0, test, test_status, question, choice, choices, chA, chB, chC, correct = 0;
// this is a multidimensional array with 4 inner array elements with 5 elements inside them
// if you don't want answers viewable in the code, then you should use PHP and mySQL database
var questions = [
  ["True of bivariate analysis","Analysis between more than 3 variables","Example is scatterplot","Uses only one variable","B"],  
  ["Refers to an experimental design technique used for determining the effect of a given sample", "Collaborative filtering", "Regression", "Power Analysis", "C"],
  ["It is a multi-disciplinary field that uses scientific methods, processes, algorithms and systems to extract knowledge and insights from data in various forms, both structured and unstructured", "Data Science", "Machine Learning", "Science", "A"],
  ["The fourth paradigm of science", "empirical", "theoretical", "data driven", "C"],
  ["Popularized the fourth paradigm of science", "Rosling", "Gray", "Naur", "B"],
  ["SQL stands for", "Standard Question Languange", "Structured Query Languange", "Strong Query Languange", "B"],
  ["SQL can, except","retrieve data from database", "insert records from database","create webpage", "C" ],
  ["SQL command which extracts data from a database","UPDATE","SELECT","INSERT", "B"],
  ["Python Library originally authored by Oliphant ","Particles","NumPy","ScikitLearn", "B"],
  ["Programming languange conceived by Guido Rossum", "Javascript","Python", "Java", "B"],
  ["Immutable type of variable exemplified by true or false", "bool","bytes","bytearray", "A"],
  ["This programing languange was derived from a british comedy group ","Python", "Java", "Javascript","A"],
  ["Python API documentation generators include all except", "Sphinx","HeaderDoc", "Particles", "C"],
  ["Languanges derived from Python, except", "Cobra", "CoffeScript","Solidity","C"],
  ["Python is a single paradigm, object oriented and structured programming ","True","False","Maybe", "B"]
];
// this get function is short for the getElementById function  
function get(x){
  return document.getElementById(x);
}
function renderQuestion(){
  test = get("test");
  if(pos >= questions.length){
    test.innerHTML = "<h2>You got "+correct+" of "+questions.length+" questions correct</h2>";
    get("test_status").innerHTML = "Test completed";
    // resets the variable to allow users to restart the test
    pos = 0;
    correct = 0;
    // stops rest of renderQuestion function running when test is completed
    return false;
  }
  get("test_status").innerHTML = "Question "+(pos+1)+" of "+questions.length;
  question = questions[pos][0];
  chA = questions[pos][1];
  chB = questions[pos][2];
  chC = questions[pos][3];
  test.innerHTML = "<h3>"+question+"</h3>";
  // the += appends to the data we started on the line above
  test.innerHTML += "<input type='radio' name='choices' value='A'> "+chA+"<br>";
  test.innerHTML += "<input type='radio' name='choices' value='B'> "+chB+"<br>";
  test.innerHTML += "<input type='radio' name='choices' value='C'> "+chC+"<br><br>";
  test.innerHTML += "<button onclick='checkAnswer()'>Submit Answer</button>";
}
function checkAnswer(){
  // use getElementsByName because we have an array which it will loop through
  choices = document.getElementsByName("choices");
  for(var i=0; i<choices.length; i++){
    if(choices[i].checked){
      choice = choices[i].value;
    }
  }
  // checks if answer matches the correct choice
  if(choice == questions[pos][4]){
    //each time there is a correct answer this value increases
    correct++;
  }
  // changes position of which character user is on
  pos++;
  // then the renderQuestion function runs again to go to next question
  renderQuestion();
}
window.addEventListener("load", renderQuestion, false);
</script>
</head>
<body>
    <div class="container"> 
        <h1>Data Science</h1>  <center><button class="btn btn-3" onclick="location.href = 'quiz.html'; " >Back</button> </center> 
        <h2 id="test_status"></h2>
        <div id="test"></div>


    </div>  
</body>
</html>
